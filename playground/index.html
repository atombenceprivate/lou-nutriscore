<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lou Nutri-Score Playground</title><style>body{margin:0;background:#101827;color:#eef2ff;font:16px system-ui;padding:2rem;max-width:1100px;margin:auto}h1{margin:0;color:#85f3c5}p{color:#afbdd4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}textarea{width:100%;min-height:280px;box-sizing:border-box;background:#182237;color:#dce8ff;border:1px solid #33415c;border-radius:10px;padding:1rem;font:13px ui-monospace}button{background:#85f3c5;color:#102018;border:0;border-radius:8px;padding:.7rem 1rem;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#182237;padding:1rem;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>Lou Nutri-Score Playground</h1><p>Try a weighted formula locally. No data leaves this page.</p><div class="grid"><label>Config<textarea id="config">{"schemaVersion":1,"factors":[{"key":"quality","weight":2,"range":{"min":0,"max":10}},{"key":"value","weight":1,"range":{"min":0,"max":10}},{"key":"risk","weight":1,"range":{"min":0,"max":10},"invert":true}],"grades":[{"name":"A","min":80},{"name":"B","min":60},{"name":"C","min":0}]}</textarea></label><label>Input<textarea id="input">{"quality":8,"value":6,"risk":2}</textarea></label></div><p><button onclick="run()">Calculate</button> <button onclick="compare()">Compare (+1 each)</button></p><pre id="output"></pre><script>const calc=(c,i)=>{let b=c.factors.map(f=>{let v=i[f.source||f.key],n=(v-f.range.min)/(f.range.max-f.range.min)*100;if(f.invert)n=100-n;n=f.clamp===false?n:Math.max(0,Math.min(100,n));return{key:f.key,rawValue:v,normalizedScore:n,weight:f.weight,weightedContribution:n*f.weight}}),s=b.reduce((a,x)=>a+x.weightedContribution,0)/b.reduce((a,x)=>a+x.weight,0),g=[...c.grades].sort((a,b)=>b.min-a.min).find(x=>s>=x.min);return{score:s,grade:g.name,breakdown:b}};function data(){return[JSON.parse(config.value),JSON.parse(input.value)]}function run(){try{output.textContent=JSON.stringify(calc(...data()),null,2)}catch(e){output.textContent=e.message}}function compare(){try{let[c,i]=data(),b=calc(c,i),n=Object.fromEntries(Object.entries(i).map(([k,v])=>[k,v+1])),a=calc(c,n);output.textContent=JSON.stringify({baseline:b,plusOne:a,delta:a.score-b.score},null,2)}catch(e){output.textContent=e.message}}run()</script></html>
